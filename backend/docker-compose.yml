version: '3.8'

services:
  db:   #เกี่ยวกับdatabaes    #ย่อหน้าต้องตรงกันทุกอย่าง
    image: mysql:8.0 # ปรับเป็น MySQL 8.0 เพื่อความทันสมัย (หรือใช้ 5.7 ตามเดิมได้หากต้องการ)
    container_name: mysql_db_821
    # MySQL 8.0 ใช้ plugin ตัวใหม่ จึงต้องใช้คำสั่งนี้เพื่อให้เข้ากับ Client รุ่นเก่าได้ดีขึ้น
    command: --default-authentication-plugin=mysql_native_password
    environment:  #ตัวแปรเข้าหาข้อมูล logingอัตโนมัติ
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: webdb
    ports:
      - "821:3306"   #ต้อง tab
    volumes:
      - mysql_data_821:/var/lib/mysql  #พื้นที่จัดเก็บฐานข้อมูล
    networks:
      - weblab821
    restart: always

  phpmyadmin:  #ใช้เข้าภึงฐานข้อมูล
    image: phpmyadmin:latest
    container_name: phpmyadmin_821
    environment:
      PMA_HOST: db # ใช้ชื่อ Service "db" แทนชื่อ Container เพื่อความยืดหยุ่นในระบบ Network
      PMA_PORT: 3306 
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 64M # เพิ่มลิมิตการอัปโหลดไฟล์ SQL
    ports:
      - "8822:80"
    depends_on:   
      - db
    networks:  #สิ่งที่บอกว่าคอนเทนเนอร์อยู่ห้องเดียวกัน
      - weblab821
    restart: always

networks:
  weblab821:   #สร้างnetworks
    driver: bridge

volumes:   #สถานที่เก็บข้อมูล
  mysql_data_821:
    driver: local