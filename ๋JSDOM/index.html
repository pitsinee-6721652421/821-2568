เพศ <br>
<input type="radio" name="gender" value="male" onchange="onchangeGender()"> ชาย
<input type="radio" name="gender" value="female" onchange="onchangeGender()"> หญิง

<script>
    function onchangeGender() {
        // เลือก radio ทั้งหมด
        let genderInput = document.querySelectorAll('input[name="gender"]');
        // เช็ตตัวไหนมี check อยู่ ให้เอา value มาแสดง
        for (let i = 0; i < genderInput.length; i++) {
            if (genderInput[i].checked) {
                console.log("เพศที่เลือกคือ " + genderInput[i].value);
            }
        }
    }
</script>
